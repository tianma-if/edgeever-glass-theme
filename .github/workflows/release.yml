name: Release EdgeEver plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/manifest.json
            dist/main.js
            dist/styles.css
            dist/SHA256SUMS
